name: update-data

on:
  schedule:
    # 시간은 UTC. 평일 KST 07~22시 매시, 주말 KST 10시·18시.
    - cron: "0 22,23 * * 0-4"   # KST 월~금 07, 08시
    - cron: "0 0-13 * * 1-5"    # KST 월~금 09~22시
    - cron: "0 1,9 * * 0,6"     # KST 토·일 10, 18시
  workflow_dispatch:
    inputs:
      full:
        description: "금리 전체 다시 받기(2000년부터)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/index.html", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 금리 수집 (ECOS)
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python scripts/fetch_rates.py ${{ inputs.full && '--full' || '' }}

      - name: 뉴스 수집 (RSS)
        continue-on-error: true
        run: python scripts/fetch_news.py

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
