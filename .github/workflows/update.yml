name: update-data

on:
  schedule:
    # 평소 실행은 Cloudflare Worker(worker/)가 매시 5분에 workflow_dispatch 로 깨운다.
    # GitHub 자체 예약은 정각·혼잡 시간에 자주 건너뛰어서, Worker 가 멈췄을 때를 대비한 하루 한 번 예비로만 둔다.
    - cron: "47 23 * * *"   # KST 매일 08:47
  workflow_dispatch:
    inputs:
      full:
        description: "금리 전체 다시 받기(2000년부터)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/index.html", "scripts/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 금리 수집 (ECOS)
        continue-on-error: true
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY || vars.ECOS_API_KEY }}
          # 키 값은 남기지 않고 어디에 등록돼 있는지만 진단용으로 넘긴다.
          ECOS_KEY_SOURCES: "secret=${{ secrets.ECOS_API_KEY != '' }}, variable=${{ vars.ECOS_API_KEY != '' }}"
        run: python scripts/fetch_rates.py ${{ inputs.full && '--full' || '' }}

      # 미국 금리(연방기금 목표범위·미국채 2·10년): FRED, 원자료 미 연준 H.15(공공영역). 금리 전망 탭에서 씀.
      - name: 미국 금리 수집 (FRED)
        continue-on-error: true
        run: python scripts/fetch_us.py

      # 미국채 금리(3개월·2·5·10·30년): 미 재무부 공식 CSV(공공영역, 키 없음). 금리 추이 화면의 '미국' 줄에서 씀.
      - name: 미국채 금리 수집 (미 재무부)
        continue-on-error: true
        run: python scripts/fetch_ust.py

      # 뉴스: 연합뉴스 RSS만(비상업·개인 용도 허용, 이 사이트는 광고 없는 비상업). 제목·링크·시각만 저장.
      - name: 뉴스 수집 (연합뉴스 RSS)
        continue-on-error: true
        run: python scripts/fetch_news.py

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin main
            git push
          fi

      # GitHub Pages(예비 주소). 가끔 GitHub 쪽에서 "artifact 를 못 찾음"(Fetching artifact metadata failed)으로
      # 실패해서, 1분 쉬고 한 번 더 한다.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true   # .nojekyll 포함(v5 부터 점 파일은 기본 제외)

      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: 배포 재시도 전 대기
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
